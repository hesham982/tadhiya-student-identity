<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="color-scheme" content="dark">
    <meta name="format-detection" content="telephone=no">
    <title>اعدادية التضحية للبنين - صفحة بيانات هوية الطالب</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- JSZip Library for Downloading All Photos Named by Student Name -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root {
            color-scheme: dark;
            --bg: #0a0f18;
            --surface: #121a29;
            --surface-2: #0d1420;
            --line: #22304a;
            --text: #e8eef8;
            --muted: #8b9cb8;
            --accent: #2563eb;
            --ok: #10b981;
            --danger: #f43f5e;
        }
        html, body {
            background-color: var(--bg);
            color: var(--text);
        }
        body {
            font-family: 'Cairo', sans-serif;
            margin: 0;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 96px);
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .card {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 18px;
        }
        .soft {
            background: var(--surface-2);
            border: 1px solid var(--line);
            border-radius: 14px;
        }
        .label {
            display: block;
            font-size: .82rem;
            font-weight: 700;
            color: var(--muted);
        }
        .input {
            width: 100%;
            background: var(--surface-2);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: .8rem 2.6rem .8rem 1rem;
            color: var(--text);
            font-size: .93rem;
            font-weight: 600;
            outline: none;
            transition: border-color .15s, box-shadow .15s;
        }
        .input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, .25);
        }
        .input::placeholder {
            color: #5d6f8c;
            font-weight: 500;
        }
        input[type=number]::-webkit-outer-spin-button,
        input[type=number]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
            appearance: textfield;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: .5rem;
            border-radius: 12px;
            font-weight: 700;
            border: 1px solid transparent;
            cursor: pointer;
            transition: transform .12s ease, filter .12s ease;
        }
        .btn:active {
            transform: scale(.98);
        }
        .btn:disabled {
            opacity: .55;
        }
        .btn-primary {
            background: var(--accent);
            color: #fff;
        }
        .btn-ghost {
            background: var(--surface-2);
            color: var(--text);
            border-color: var(--line);
        }
        .btn-danger {
            background: rgba(244, 63, 94, .12);
            color: #fb7185;
            border-color: rgba(244, 63, 94, .3);
        }
        .chip {
            display: inline-flex;
            align-items: center;
            gap: .35rem;
            font-size: .72rem;
            font-weight: 700;
            padding: .22rem .6rem;
            border-radius: 999px;
            border: 1px solid var(--line);
            background: var(--surface-2);
            color: var(--muted);
        }
        .icon-box {
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 14px;
            background: rgba(37, 99, 235, .16);
            color: #60a5fa;
            border: 1px solid rgba(37, 99, 235, .32);
        }
        .field-icon {
            position: absolute;
            top: 0;
            bottom: 0;
            right: 0;
            display: flex;
            align-items: center;
            padding-right: .9rem;
            color: #5d6f8c;
            pointer-events: none;
        }
        .divider {
            border-color: var(--line) !important;
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #2a3a55;
            border-radius: 9999px;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade {
            animation: fadeIn 0.25s ease-out forwards;
        }
        /* Mirror front camera stream naturally */
        .mirror-video {
            transform: scaleX(-1);
        }
        /* Structured Admin Table Row Heights */
        .admin-table thead tr {
            height: 32px;
        }
        .admin-table tbody tr {
            height: 30px;
        }
        .admin-table tbody tr + tr {
            border-color: var(--line) !important;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Header -->
    <header class="sticky top-0 z-30 border-b" style="background: rgba(10, 15, 24, .92); backdrop-filter: blur(12px); border-color: var(--line);">
        <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between gap-3">

            <div class="flex items-center gap-2.5 min-w-0">
                <div class="icon-box w-10 h-10 flex-shrink-0">
                    <i class="fa-solid fa-school"></i>
                </div>
                <h1 class="font-extrabold text-sm sm:text-base leading-tight truncate">اعدادية التضحية للبنين</h1>
            </div>

            <div class="flex items-center gap-2 flex-shrink-0">
                <!-- Connection Status -->
                <div id="db-status-badge" class="hidden md:flex items-center gap-1.5 chip">
                    <span id="db-status-dot" class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
                    <span id="db-status-text">جاري الاتصال...</span>
                </div>

                <!-- Admin -->
                <button id="admin-access-btn" onclick="handleAdminButtonClick()" title="بوابة المشرف" class="btn btn-ghost px-3 py-2 text-xs">
                    <i id="admin-lock-icon" class="fa-solid fa-lock text-amber-300"></i>
                    <span id="admin-lock-label">الإدارة</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-3xl w-full mx-auto px-4 pt-5 flex-1">

        <!-- Notification Banner -->
        <div id="toast-banner" class="hidden mb-4 p-3.5 rounded-2xl flex items-center justify-between gap-3 animate-fade border" style="background: var(--surface); border-color: var(--line);">
            <div class="flex items-center gap-3">
                <i id="toast-icon" class="fa-solid fa-circle-check text-xl"></i>
                <p id="toast-message" class="text-sm font-bold"></p>
            </div>
            <button onclick="hideToast()" class="text-current opacity-60 hover:opacity-100">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <!-- VIEW 1: STUDENT REGISTRATION FORM (DEFAULT PUBLIC VIEW FOR STUDENTS) -->
        <section id="section-register" class="animate-fade">
            <div class="card p-5">
                <div class="flex items-center gap-2 border-b divider pb-4 mb-5">
                    <i class="fa-solid fa-id-card text-blue-400"></i>
                    <h2 class="text-base font-extrabold">بيانات الطالب</h2>
                </div>

                <form id="student-form" class="space-y-5">
                    <!-- الاسم الرباعي -->
                    <div>
                        <div class="flex items-center justify-between mb-2">
                            <label for="student-name" class="label">الاسم الرباعي <span class="text-rose-400">*</span></label>
                            <span id="quad-name-badge" class="chip" dir="ltr">0 / 4</span>
                        </div>
                        <div class="relative">
                            <span class="field-icon">
                                <i class="fa-solid fa-user"></i>
                            </span>
                            <input
                                type="text"
                                id="student-name"
                                required
                                oninput="handleQuadNameInput()"
                                placeholder="أحمد محمد علي حسن"
                                class="input"
                            >
                        </div>
                        <p id="quad-name-hint" class="text-[11px] mt-1.5" style="color: var(--muted);"></p>
                    </div>

                    <!-- سنة الميلاد -->
                    <div>
                        <label for="student-birth-year" class="label mb-2">سنة الميلاد <span class="text-rose-400">*</span></label>
                        <div class="relative">
                            <span class="field-icon">
                                <i class="fa-solid fa-calendar-day"></i>
                            </span>
                            <input
                                type="number"
                                id="student-birth-year"
                                inputmode="numeric"
                                dir="ltr"
                                min="1990"
                                max="2026"
                                step="1"
                                required
                                placeholder="2008"
                                class="input text-left tracking-wide"
                            >
                        </div>
                    </div>

                    <!-- رقم هاتف ولي الأمر -->
                    <div>
                        <label for="guardian-phone" class="label mb-2">هاتف ولي الأمر <span class="text-rose-400">*</span></label>
                        <div class="relative">
                            <span class="field-icon">
                                <i class="fa-solid fa-phone"></i>
                            </span>
                            <input
                                type="tel"
                                id="guardian-phone"
                                dir="ltr"
                                inputmode="tel"
                                required
                                placeholder="07701234567"
                                class="input text-left tracking-wide"
                            >
                        </div>
                    </div>

                    <!-- صورة الطالب -->
                    <div>
                        <label class="label mb-2">صورة الطالب <span class="text-rose-400">*</span></label>
                        <div class="soft p-4 text-center relative overflow-hidden">

                            <!-- Idle -->
                            <div id="camera-idle-state" class="py-5 flex flex-col items-center gap-3">
                                <div class="icon-box w-14 h-14">
                                    <i class="fa-solid fa-camera text-xl"></i>
                                </div>
                                <button
                                    type="button"
                                    onclick="startLiveCamera()"
                                    class="btn btn-primary px-5 py-3 text-xs sm:text-sm"
                                >
                                    <i class="fa-solid fa-video"></i>
                                    <span>تشغيل الكاميرا</span>
                                </button>
                            </div>

                            <!-- Live Viewfinder -->
                            <div id="camera-stream-state" class="hidden flex-col items-center">
                                <div class="relative w-full max-w-xs aspect-[3/4] bg-black rounded-2xl overflow-hidden border border-blue-500/60 mx-auto">
                                    <video
                                        id="live-camera-video"
                                        autoplay
                                        playsinline
                                        muted
                                        class="w-full h-full object-cover mirror-video"
                                    ></video>

                                    <div class="absolute inset-0 pointer-events-none flex items-center justify-center">
                                        <div class="w-[70%] h-[62%] border-2 border-dashed border-white/60 rounded-[50%] shadow-[0_0_0_9999px_rgba(0,0,0,0.45)]"></div>
                                    </div>

                                    <button
                                        type="button"
                                        onclick="toggleCameraFacingMode()"
                                        title="تبديل الكاميرا"
                                        class="absolute top-3 left-3 w-9 h-9 rounded-full bg-black/60 text-white flex items-center justify-center"
                                    >
                                        <i class="fa-solid fa-camera-rotate text-sm"></i>
                                    </button>
                                </div>

                                <div class="mt-3 flex items-center justify-center gap-2 w-full max-w-xs">
                                    <button type="button" onclick="captureLiveFrame()" class="btn btn-primary flex-1 py-3 text-xs">
                                        <i class="fa-solid fa-camera"></i>
                                        <span>التقاط</span>
                                    </button>
                                    <button type="button" onclick="stopLiveCamera(true)" class="btn btn-ghost px-4 py-3 text-xs">
                                        إلغاء
                                    </button>
                                </div>
                            </div>

                            <!-- Preview -->
                            <div id="photo-preview-state" class="hidden flex-col sm:flex-row items-center justify-center gap-4 py-2">
                                <div class="relative">
                                    <img id="photo-preview-img" src="" alt="" class="w-28 h-36 rounded-2xl object-cover border-2 border-emerald-500">
                                    <span class="absolute -top-2 -right-2 bg-emerald-600 text-white w-6 h-6 rounded-full flex items-center justify-center text-[10px]">
                                        <i class="fa-solid fa-check"></i>
                                    </span>
                                </div>
                                <button type="button" onclick="retakePhoto()" class="btn btn-ghost px-3.5 py-2 text-xs">
                                    <i class="fa-solid fa-rotate-right"></i>
                                    <span>إعادة التقاط</span>
                                </button>
                            </div>

                            <!-- Camera Fallback -->
                            <div id="camera-fallback-box" class="hidden mt-3 pt-3 border-t divider">
                                <input
                                    type="file"
                                    id="strict-camera-fallback-input"
                                    accept="image/*"
                                    capture="user"
                                    class="hidden"
                                >
                                <button
                                    type="button"
                                    onclick="document.getElementById('strict-camera-fallback-input').click()"
                                    class="btn btn-ghost px-4 py-2.5 text-xs"
                                >
                                    <i class="fa-solid fa-camera"></i>
                                    <span>فتح كاميرا الهاتف</span>
                                </button>
                            </div>

                        </div>
                    </div>

                    <!-- Submit -->
                    <button
                        type="submit"
                        id="submit-btn"
                        class="btn btn-primary w-full py-3.5 text-sm"
                    >
                        <i class="fa-solid fa-paper-plane"></i>
                        <span>حفظ البيانات</span>
                    </button>
                </form>
            </div>
        </section>

        <!-- Success -->
        <section id="section-student-success" class="hidden animate-fade">
            <div class="card p-7 text-center">
                <div class="w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl" style="background: rgba(16, 185, 129, .15); color: #34d399;">
                    <i class="fa-solid fa-check"></i>
                </div>
                <h2 class="text-lg font-extrabold">تم حفظ البيانات</h2>
                <p id="success-student-summary" class="text-sm font-bold mt-2" style="color: var(--muted);"></p>
                <p id="success-photo-filename" class="chip mt-3"></p>
                <div class="mt-6 flex items-center gap-2.5">
                    <button
                        type="button"
                        onclick="resetForAnotherStudent()"
                        class="btn btn-primary flex-1 py-3 text-xs"
                    >
                        <i class="fa-solid fa-rotate-right"></i>
                        <span>تسجيل طالب آخر</span>
                    </button>
                    <button
                        type="button"
                        id="tg-close-app-btn"
                        onclick="closeTelegramWebApp()"
                        class="hidden btn btn-ghost flex-1 py-3 text-xs"
                    >
                        <i class="fa-brands fa-telegram"></i>
                        <span>إغلاق</span>
                    </button>
                </div>
            </div>
        </section>

        <!-- Admin Dashboard -->
        <section id="section-browse" class="hidden animate-fade space-y-4">

            <div class="card p-4 flex items-center justify-between gap-3">
                <div class="flex items-center gap-2.5 min-w-0">
                    <div class="icon-box w-10 h-10 flex-shrink-0" style="background: rgba(245, 158, 11, .14); border-color: rgba(245, 158, 11, .3); color: #fbbf24;">
                        <i class="fa-solid fa-user-shield"></i>
                    </div>
                    <h2 class="text-sm font-extrabold truncate">لوحة المشرف</h2>
                    <span id="students-count-badge" class="bg-blue-600 text-white text-[11px] px-2 py-0.5 rounded-full font-extrabold">0</span>
                </div>
                <button onclick="lockAdminDashboard()" class="btn btn-ghost px-3 py-2 text-[11px] flex-shrink-0">
                    <i class="fa-solid fa-lock text-rose-400"></i>
                    <span>خروج</span>
                </button>
            </div>

            <div class="card p-4 space-y-3">
                <div class="flex flex-wrap items-center gap-2">
                    <button
                        id="view-mode-cards"
                        onclick="setAdminLayoutMode('cards')"
                        class="btn btn-primary px-3 py-2 text-xs"
                    >
                        <i class="fa-solid fa-grip"></i>
                        <span>بطاقات</span>
                    </button>
                    <button
                        id="view-mode-table"
                        onclick="setAdminLayoutMode('table')"
                        class="btn btn-ghost px-3 py-2 text-xs"
                    >
                        <i class="fa-solid fa-table"></i>
                        <span>جدول</span>
                    </button>
                    <span class="flex-1"></span>
                    <button
                        id="download-all-zip-btn"
                        onclick="downloadAllPhotosAsZip()"
                        class="btn btn-ghost px-3 py-2 text-xs"
                    >
                        <i class="fa-solid fa-file-zipper"></i>
                        <span>ZIP</span>
                    </button>
                    <button onclick="exportToCSV()" class="btn btn-ghost px-3 py-2 text-xs">
                        <i class="fa-solid fa-file-csv"></i>
                        <span>CSV</span>
                    </button>
                </div>

                <div class="flex flex-col sm:flex-row gap-2">
                    <div class="relative flex-1">
                        <span class="field-icon">
                            <i class="fa-solid fa-magnifying-glass"></i>
                        </span>
                        <input
                            type="text"
                            id="search-input"
                            oninput="renderStudentsList()"
                            placeholder="بحث"
                            class="input py-2.5 text-sm"
                        >
                    </div>
                    <select id="sort-select" onchange="renderStudentsList()" class="input sm:w-auto py-2.5 text-xs">
                        <option value="newest">الأحدث</option>
                        <option value="oldest">الأقدم</option>
                        <option value="name">أبجدي</option>
                    </select>
                </div>
            </div>

            <div id="students-container" class="grid grid-cols-1 sm:grid-cols-2 gap-3"></div>

            <div id="students-table-wrapper" class="hidden card overflow-x-auto">
                <table class="w-full text-right border-collapse admin-table">
                    <thead>
                        <tr class="text-[11px] font-bold" style="background: var(--surface-2); color: var(--muted);">
                            <th class="px-3">الصورة</th>
                            <th class="px-3">الاسم</th>
                            <th class="px-3">سنة الميلاد</th>
                            <th class="px-3">الهاتف</th>
                            <th class="px-3">الملف</th>
                            <th class="px-3">التسجيل</th>
                            <th class="px-3 text-center">إجراء</th>
                        </tr>
                    </thead>
                    <tbody id="students-table-body" class="divide-y" style="border-color: var(--line);"></tbody>
                </table>
            </div>

            <div id="empty-database-state" class="hidden card p-10 text-center">
                <div class="icon-box w-14 h-14 mx-auto mb-3">
                    <i class="fa-solid fa-folder-open text-lg"></i>
                </div>
                <h3 class="text-sm font-bold" style="color: var(--muted);">لا توجد سجلات</h3>
            </div>
        </section>

    </main>


    <!-- Student Modal -->
    <div id="student-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
        <div class="card max-w-md w-full overflow-hidden animate-fade">
            <div class="relative bg-black h-72 flex items-center justify-center">
                <img id="modal-student-photo" src="" alt="" class="max-h-full max-w-full object-contain">
                <button onclick="closeStudentModal()" class="absolute top-3 left-3 w-9 h-9 rounded-full bg-black/60 text-white flex items-center justify-center">
                    <i class="fa-solid fa-xmark"></i>
                </button>
                <a
                    id="modal-download-photo"
                    href="#"
                    download="student_photo.jpg"
                    class="absolute bottom-3 right-3 bg-white/90 text-slate-900 text-[11px] font-bold px-3 py-2 rounded-xl flex items-center gap-1.5"
                >
                    <i class="fa-solid fa-download text-blue-600"></i>
                    <span id="modal-download-photo-label">تحميل</span>
                </a>
            </div>
            <div class="p-5 space-y-3">
                <div class="flex items-start justify-between gap-2">
                    <h3 id="modal-student-name" class="text-base font-extrabold"></h3>
                    <span id="modal-student-date" class="chip"></span>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div class="soft p-3">
                        <span class="text-[10px] font-bold block" style="color: var(--muted);">سنة الميلاد</span>
                        <span id="modal-student-birth" class="text-sm font-extrabold text-violet-300"></span>
                    </div>
                    <div class="soft p-3">
                        <span class="text-[10px] font-bold block" style="color: var(--muted);">الهاتف</span>
                        <span id="modal-guardian-phone" dir="ltr" class="text-sm font-extrabold select-all"></span>
                    </div>
                </div>

                <div class="soft px-3 py-2 flex items-center gap-2 min-w-0">
                    <i class="fa-regular fa-file-image text-blue-400"></i>
                    <p id="modal-photo-filename" class="text-xs font-bold truncate"></p>
                </div>

                <div class="flex items-center gap-2">
                    <a id="modal-call-guardian" href="#" class="btn btn-ghost flex-1 py-2.5 text-xs">
                        <i class="fa-solid fa-phone"></i>
                        <span>اتصال</span>
                    </a>
                    <button onclick="copyModalGuardianPhone()" class="btn btn-ghost flex-1 py-2.5 text-xs">
                        <i class="fa-regular fa-copy"></i>
                        <span>نسخ</span>
                    </button>
                </div>

                <div class="flex items-center gap-2 pt-1">
                    <button id="modal-delete-btn" class="btn btn-danger flex-1 py-2.5 text-xs">
                        <i class="fa-solid fa-trash-can"></i>
                        <span>حذف</span>
                    </button>
                    <button onclick="closeStudentModal()" class="btn btn-ghost flex-1 py-2.5 text-xs">
                        إغلاق
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Delete Confirmation -->
    <div id="confirm-delete-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
        <div class="card max-w-sm w-full p-6 text-center animate-fade">
            <div class="w-12 h-12 rounded-full flex items-center justify-center mx-auto mb-3" style="background: rgba(244, 63, 94, .15); color: #fb7185;">
                <i class="fa-solid fa-triangle-exclamation"></i>
            </div>
            <h3 class="text-sm font-extrabold">حذف السجل نهائياً؟</h3>
            <div class="mt-5 flex items-center gap-2.5">
                <button id="confirm-delete-yes" class="btn flex-1 py-2.5 text-xs" style="background: var(--danger); color: #fff;">
                    نعم، احذف
                </button>
                <button onclick="closeConfirmDeleteModal()" class="btn btn-ghost flex-1 py-2.5 text-xs">
                    إلغاء
                </button>

        // 4. API Helper (all privileged operations go through the Edge Function)
        class ApiError extends Error {
            constructor(message, status = 0) {
                super(message);
                this.name = 'ApiError';
                this.status = status;
            }
        }

        function isBackendConfigured() {
            return /^https?:\/\//i.test(String(APP_CONFIG.apiBaseUrl || ''));
        }

        function buildApiUrl(query = '') {
            const base = String(APP_CONFIG.apiBaseUrl).replace(/\/+$/, '');
            const fn = String(APP_CONFIG.functionName || 'students').replace(/^\/+/, '');
            return `${base}/${fn}${query ? `?${query}` : ''}`;
        }

        async function apiFetch(query = '', options = {}) {
            if (!isBackendConfigured()) {
                throw new ApiError('لم يتم إعداد الخادم بعد. يرجى ضبط apiBaseUrl في إعدادات الصفحة.', 0);
            }
            if (!initDataRaw) {
                throw new ApiError('يجب فتح هذه الصفحة من داخل تيليجرام حتى يتم التحقق من هويتك.', 401);
            }

            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), 25000);

            try {
                const response = await fetch(buildApiUrl(query), {
                    ...options,
                    headers: Object.assign({
                        'Authorization': `tma ${initDataRaw}`,
                        'X-Telegram-Init-Data': initDataRaw
                    }, APP_CONFIG.apiKey ? { 'apikey': APP_CONFIG.apiKey } : {}, options.body ? { 'Content-Type': 'application/json' } : {}, options.headers || {}),
                    signal: controller.signal
                });

                let payload = null;
                try {
                    payload = await response.json();
                } catch (e) {
                    payload = null;
                }

                if (!response.ok) {
                    const message = (payload && payload.error) || defaultErrorMessage(response.status);
                    throw new ApiError(message, response.status);
                }
                return payload;
            } catch (err) {
                if (err instanceof ApiError) throw err;
                if (err?.name === 'AbortError') {
                    throw new ApiError('انتهت مهلة الاتصال بالخادم، تحقق من الشبكة وحاول مجدداً.', 0);
                }
                throw new ApiError('تعذر الاتصال بالخادم، تحقق من الإنترنت وحاول مجدداً.', 0);
            } finally {
                clearTimeout(timer);
            }
        }

        function defaultErrorMessage(status) {
            if (status === 401) return 'جلسة تيليجرام غير صالحة أو منتهية. أعد فتح التطبيق من البوت.';
            if (status === 403) return 'هذا الإجراء مخصص لمشرف المدرسة فقط.';
            if (status === 404) return 'الخدمة غير متوفرة على الخادم (قد لم تُنشر دالة students بعد).';
            if (status === 413) return 'حجم الصورة أكبر من الحد المسموح.';
            if (status === 429) return 'عدد المحاولات كبير، يرجى الانتظار قليلاً ثم المحاولة مجدداً.';
            if (status >= 500) return 'حدث خطأ في الخادم، يرجى المحاولة لاحقاً.';
            return 'تعذر تنفيذ الطلب، يرجى المحاولة مرة أخرى.';
        }

        // 6. STRICT LIVE CAMERA CAPTURE LOGIC (WebRTC getUserMedia)
        window.startLiveCamera = async function() {
            haptic('light');
            const idleState = document.getElementById('camera-idle-state');
            const streamState = document.getElementById('camera-stream-state');
            const previewState = document.getElementById('photo-preview-state');
            const fallbackBox = document.getElementById('camera-fallback-box');
            const videoEl = document.getElementById('live-camera-video');

            stopLiveCamera(false);

            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                fallbackBox.classList.remove('hidden');
                showToast('يرجى استخدام زر فتح كاميرا الهاتف المباشرة أدناه', 'info');
                return;
            }

            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: { ideal: currentFacingMode },
                        width: { ideal: 720 },
                        height: { ideal: 960 }
                    },
                    audio: false
                });

                videoEl.srcObject = mediaStream;
                videoEl.classList.toggle('mirror-video', currentFacingMode === 'user');

                await videoEl.play();

                idleState.classList.add('hidden');
                previewState.classList.add('hidden');
                fallbackBox.classList.add('hidden');
                streamState.classList.remove('hidden');
                streamState.classList.add('flex');
            } catch (err) {
                console.error("Live camera error:", err);
                fallbackBox.classList.remove('hidden');
                showToast('تعذر الوصول المباشر للكاميرا، يرجى السماح بصلاحية الكاميرا أو استخدام زر الكاميرا البديل', 'error');
            }
        };

        window.toggleCameraFacingMode = function() {

            currentFacingMode = currentFacingMode === "user" ? "environment" : "user";
            startLiveCamera();
        };

        window.stopLiveCamera = function(returnToIdle = false) {
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
                mediaStream = null;
            }
            const videoEl = document.getElementById('live-camera-video');
            if (videoEl) videoEl.srcObject = null;

            const streamState = document.getElementById('camera-stream-state');
            streamState.classList.add('hidden');
            streamState.classList.remove('flex');

            if (returnToIdle && !compressedPhotoBase64) {
                document.getElementById('camera-idle-state').classList.remove('hidden');
            }
        };

        window.captureLiveFrame = function() {
            const videoEl = document.getElementById('live-camera-video');
            if (!videoEl || !videoEl.videoWidth) {
                showToast('الكاميرا غير جاهزة بعد، انتظر لحظة ثم حاول مجدداً', 'error');
                return;
            }

            const maxDimension = 550;
            let width = videoEl.videoWidth;
            let height = videoEl.videoHeight;

            if (width > height) {
                if (width > maxDimension) {
                    height = Math.round((height * maxDimension) / width);
                    width = maxDimension;
                }
            } else {
                if (height > maxDimension) {
                    width = Math.round((width * maxDimension) / height);
                    height = maxDimension;
                }
            }

            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = "#FFFFFF";
            ctx.fillRect(0, 0, width, height);

            if (currentFacingMode === 'user') {
                ctx.translate(width, 0);
                ctx.scale(-1, 1);
            }

            ctx.drawImage(videoEl, 0, 0, width, height);

            const dataUrl = canvas.toDataURL('image/jpeg', 0.75);
            compressedPhotoBase64 = dataUrl;

            stopLiveCamera(false);

            document.getElementById('camera-idle-state').classList.add('hidden');
            const previewState = document.getElementById('photo-preview-state');
            previewState.classList.remove('hidden');
            previewState.classList.add('flex');
            document.getElementById('photo-preview-img').src = dataUrl;

            const currentNameVal = document.getElementById('student-name').value.trim();
            const photoFilename = buildStudentPhotoFilename(currentNameVal || 'الاسم الرباعي للطالب');
            const savedNameEl = document.getElementById('photo-saved-name-preview');
            if (savedNameEl) savedNameEl.textContent = `اسم ملف الصورة: ${photoFilename}`;

            haptic('medium');
        };

        function resetPhotoPreview() {

        // Strict Fallback Hardware Camera Input Handler (only when WebRTC is blocked)
        const strictFallbackInput = document.getElementById('strict-camera-fallback-input');
        strictFallbackInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            try {
                const compressedDataUrl = await compressImageFile(file, 550, 0.72);
                compressedPhotoBase64 = compressedDataUrl;

                document.getElementById('camera-idle-state').classList.add('hidden');
                const previewState = document.getElementById('photo-preview-state');
                previewState.classList.remove('hidden');
                previewState.classList.add('flex');
                document.getElementById('photo-preview-img').src = compressedDataUrl;

                const currentNameVal = document.getElementById('student-name').value.trim();
                const photoFilename = buildStudentPhotoFilename(currentNameVal || 'الاسم الرباعي للطالب');
                const savedNameEl = document.getElementById('photo-saved-name-preview');
                if (savedNameEl) savedNameEl.textContent = `اسم ملف الصورة: ${photoFilename}`;
            } catch (err) {
                console.error("Fallback image error:", err);
                showToast('حدث خطأ أثناء معالجة الصورة الملتقطة', 'error');
            }
        });

        function compressImageFile(file, maxDimension = 550, quality = 0.72) {
            return new Promise((resolve, reject) => {
                if (!file.type || !file.type.startsWith('image/')) {
                    reject(new Error('not an image'));
                    return;
                }
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        let width = img.width;
                        let height = img.height;
                        if (width > height) {
                            if (width > maxDimension) {
                                height = Math.round((height * maxDimension) / width);
                                width = maxDimension;
                            }
                        } else {
                            if (height > maxDimension) {
                                width = Math.round((width * maxDimension) / height);
                                height = maxDimension;
                            }
                        }
                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.fillStyle = "#FFFFFF";
                        ctx.fillRect(0, 0, width, height);
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                    img.onerror = reject;
                    img.src = event.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        // 7. ADMIN ACCESS — verified on the server via Telegram initData (no PIN)
        async function refreshAdminStatus() {
            if (!isBackendConfigured() || !initDataRaw) {
                setDbStatus(isBackendConfigured() ? 'unauthorized' : 'offline');
                return false;
            }

            try {
                const data = await apiFetch('action=whoami');
                isAdminVerified = Boolean(data && data.isAdmin);
                setDbStatus('online');
                return isAdminVerified;
            } catch (err) {
                console.error("Admin status check failed:", err);
                isAdminVerified = false;
                setDbStatus(err.status === 403 ? 'unauthorized' : (err.status === 401 ? 'unauthorized' : 'error'));
                return false;
            }
        }

        async function unlockAdminDashboard() {
            isAdminUnlocked = true;

            document.getElementById('section-browse').classList.remove('hidden');

            const lockIcon = document.getElementById('admin-lock-icon');
            const lockLabel = document.getElementById('admin-lock-label');
            if (lockIcon) lockIcon.className = "fa-solid fa-unlock text-emerald-300";
            if (lockLabel) lockLabel.textContent = "خروج المشرف";

            updateTelegramMainButton('admin');
            updateTelegramBackButton();
            haptic('success');

            await loadStudents();

            showToast('تم فتح لوحة تحكم المشرف بنجاح', 'success');
        }

        async function loadStudents() {
            if (!isAdminUnlocked) return;

            try {
                const data = await apiFetch('');
                studentsList = Array.isArray(data?.students) ? data.students : [];
                document.getElementById('students-count-badge').textContent = studentsList.length;
                setDbStatus('online');
                renderStudentsList();
            } catch (err) {
                console.error("Load students failed:", err);
                haptic('error');
                if (err.status === 403 || err.status === 401) {
                    showToast('انتهت أو انعدمت صلاحية المشرف، سيتم قفل اللوحة.', 'error');
                    lockAdminDashboard();
                } else {
                    showToast(err.message || 'تعذر جلب البيانات من الخادم', 'error');
                    setDbStatus('error');
                }
            }
        }

        window.lockAdminDashboard = function() {
            isAdminUnlocked = false;
            studentsList = [];

            document.getElementById('section-browse').classList.add('hidden');
            document.getElementById('section-register').classList.remove('hidden');

            const lockIcon = document.getElementById('admin-lock-icon');
            const lockLabel = document.getElementById('admin-lock-label');
            if (lockIcon) lockIcon.className = "fa-solid fa-lock text-amber-300";
            if (lockLabel) lockLabel.textContent = "الإدارة";

            updateTelegramMainButton('register');
            updateTelegramBackButton();
            haptic('light');
            showToast('تم قفل لوحة المشرف والعودة لواجهة الطالب', 'info');
        };

        window.setAdminLayoutMode = function(mode) {
            haptic('selection');
            adminLayoutMode = mode;
            const btnCards = document.getElementById('view-mode-cards');
            const btnTable = document.getElementById('view-mode-table');

            if (mode === 'cards') {
                btnCards.className = "btn btn-primary px-3 py-2 text-xs";
                btnTable.className = "btn btn-ghost px-3 py-2 text-xs";
            } else {
                btnTable.className = "btn btn-primary px-3 py-2 text-xs";
                btnCards.className = "btn btn-ghost px-3 py-2 text-xs";
            }
            renderStudentsList();
        };

        // Birth year input constraints (max is the current year, never a full date)
        const birthYearInput = document.getElementById('student-birth-year');
        birthYearInput.min = String(BIRTH_YEAR_MIN);
        birthYearInput.max = String(BIRTH_YEAR_MAX);

        // 8. Student Form Submission Handler
        const studentForm = document.getElementById('student-form');
        studentForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const rawName = document.getElementById('student-name').value.trim().replace(/\s+/g, ' ');
            const guardianPhone = document.getElementById('guardian-phone').value.trim();
            const birthYearRaw = birthYearInput.value.trim();

            // Validate Quadruple Name (at least 4 parts)
            const nameParts = rawName.split(' ').filter(Boolean);
            if (nameParts.length < 4) {
                haptic('error');
                showToast('يرجى كتابة الاسم الرباعي الكامل للطالب (4 أسماء على الأقل)', 'error');
                document.getElementById('student-name').focus();
                return;
            }

            // Validate Birth Year (four digits, inside the allowed range)
            if (!/^\d{4}$/.test(birthYearRaw)) {
                haptic('error');
                showToast('يرجى إدخال سنة الميلاد بأربعة أرقام فقط (مثال: 2008)', 'error');
                birthYearInput.focus();
                return;
            }

            const birthYear = Number(birthYearRaw);
            if (birthYear < BIRTH_YEAR_MIN || birthYear > BIRTH_YEAR_MAX) {
                haptic('error');
                showToast(`سنة الميلاد يجب أن تكون بين ${BIRTH_YEAR_MIN} و ${BIRTH_YEAR_MAX}`, 'error');
                birthYearInput.focus();
                return;
            }

            // Validate Guardian Phone Number
            const digitsOnly = guardianPhone.replace(/\D/g, '');
            if (digitsOnly.length < 10) {
                haptic('error');
                showToast('يرجى إدخال رقم هاتف ولي الأمر بشكل صحيح (10 أرقام على الأقل)', 'error');
                document.getElementById('guardian-phone').focus();
                return;
            }

            if (!compressedPhotoBase64) {
                haptic('error');
                showToast('يجب تشغيل الكاميرا والتقاط صورة الطالب الشخصية أولاً', 'error');
                return;
            }

            const photoFileName = buildStudentPhotoFilename(rawName);
            const submitBtn = document.getElementById('submit-btn');
            const originalBtnHtml = submitBtn.innerHTML;
            submitBtn.disabled = true;
            submitBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> <span>جاري حفظ البيانات والصورة باسم الطالب...</span>`;

            if (tg?.MainButton) {
                tg.MainButton.showProgress();
                tg.MainButton.disable();
            }

            try {
                await apiFetch('', {
                    method: 'POST',
                    body: JSON.stringify({
                        studentName: rawName,
                        birthYear: birthYear,
                        guardianPhone: guardianPhone,
                        photoFileName: photoFileName,
                        photoBase64: compressedPhotoBase64,
                        captureMethod: 'live_camera'
                    })
                });

                studentForm.reset();
                handleQuadNameInput();
                resetPhotoPreview();

                document.getElementById('section-register').classList.add('hidden');
                document.getElementById('section-student-success').classList.remove('hidden');
                document.getElementById('success-student-summary').textContent =
                    `الاسم الرباعي: ${rawName} — سنة الميلاد: ${birthYear} — هاتف ولي الأمر: ${guardianPhone}`;
                document.getElementById('success-photo-filename').innerHTML =
                    `<i class="fa-regular fa-file-image ml-1"></i> تم حفظ الصورة باسم: ${escapeHtml(photoFileName)}`;

                updateTelegramMainButton('success');
                updateTelegramBackButton();
                haptic('success');

                showToast(`تم حفظ بياناتك وصورتك باسم (${photoFileName}) بنجاح!`, 'success');
            } catch (error) {
                console.error("Error saving student:", error);
                haptic('error');
                showToast(error.message || 'حدث خطأ أثناء حفظ البيانات، يرجى المحاولة مرة أخرى', 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = originalBtnHtml;
                if (tg?.MainButton) {
                    tg.MainButton.hideProgress();
                    tg.MainButton.enable();
                }
            }
        });

        window.resetForAnotherStudent = function() {
            haptic('light');
            document.getElementById('section-student-success').classList.add('hidden');
            document.getElementById('section-register').classList.remove('hidden');
            updateTelegramMainButton('register');
            updateTelegramBackButton();
        };

        // 9. Render & Filter Students in Admin Browse View
        window.renderStudentsList = function() {
            if (!isAdminUnlocked) return;

            const cardsContainer = document.getElementById('students-container');
            const tableWrapper = document.getElementById('students-table-wrapper');
            const tableBody = document.getElementById('students-table-body');
            const emptyState = document.getElementById('empty-database-state');

            const searchQuery = (document.getElementById('search-input')?.value || '').trim().toLowerCase();
            const sortBy = document.getElementById('sort-select')?.value || 'newest';

            let filtered = studentsList.filter(item => {
                const nameMatch = (item.studentName || '').toLowerCase().includes(searchQuery);
                const phoneVal = item.guardianPhone || '';
                const phoneMatch = phoneVal.toLowerCase().includes(searchQuery);
                const fileMatch = (item.photoFileName || '').toLowerCase().includes(searchQuery);
                const birthMatch = String(item.birthYear || '').includes(searchQuery);
                return nameMatch || phoneMatch || fileMatch || birthMatch;
            });

            filtered.sort((a, b) => {
                if (sortBy === 'newest') return new Date(b.createdAt || 0) - new Date(a.createdAt || 0);
                if (sortBy === 'oldest') return new Date(a.createdAt || 0) - new Date(b.createdAt || 0);
                if (sortBy === 'name') return (a.studentName || '').localeCompare(b.studentName || '', 'ar');
                return 0;
            });

            cardsContainer.innerHTML = '';
            tableBody.innerHTML = '';

            if (filtered.length === 0) {
                cardsContainer.classList.add('hidden');
                tableWrapper.classList.add('hidden');
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');

            if (adminLayoutMode === 'cards') {
                cardsContainer.classList.remove('hidden');
                tableWrapper.classList.add('hidden');
            } else {
                cardsContainer.classList.add('hidden');
                tableWrapper.classList.remove('hidden');
            }

            filtered.forEach((student) => {
                const guardianPhone = student.guardianPhone || 'غير متوفر';
                const storedPhotoFilename = student.photoFileName || buildStudentPhotoFilename(student.studentName);
                const photoUrl = student.photoUrl || PHOTO_PLACEHOLDER;

                const dateFormatted = student.createdAt
                    ? new Date(student.createdAt).toLocaleDateString('ar-IQ', {
                        year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
                      })
                    : 'الآن';

                // Render Card Item
                const card = document.createElement('div');
                card.className = "card p-3 flex items-center gap-3 cursor-pointer";
                card.onclick = () => openStudentModal(student.id);

                const imgEl = document.createElement('img');
                imgEl.src = photoUrl;
                imgEl.onerror = () => { imgEl.onerror = null; imgEl.src = PHOTO_PLACEHOLDER; };
                imgEl.alt = storedPhotoFilename;
                imgEl.title = storedPhotoFilename;
                imgEl.loading = 'lazy';
                imgEl.className = "w-14 h-14 rounded-xl object-cover flex-shrink-0";
                imgEl.style.background = 'var(--surface-2)';

                const infoDiv = document.createElement('div');
                infoDiv.className = "flex-1 min-w-0";

                const nameEl = document.createElement('h4');
                nameEl.className = "font-bold text-sm truncate";
                nameEl.textContent = student.studentName;

                const numBadge = document.createElement('div');
                numBadge.className = "chip";
                numBadge.innerHTML = `<i class="fa-solid fa-phone text-[10px]"></i> <span dir="ltr">${escapeHtml(guardianPhone)}</span>`;

                const birthBadge = document.createElement('div');
                birthBadge.className = "chip";
                birthBadge.innerHTML = `<i class="fa-solid fa-cake-candles text-[10px]"></i> <span>${escapeHtml(formatBirthYearDisplay(student.birthYear))}</span>`;

                const badgesRow = document.createElement('div');
                badgesRow.className = "flex flex-wrap items-center gap-1.5 mt-1.5";
                badgesRow.appendChild(numBadge);
                badgesRow.appendChild(birthBadge);

                const metaRow = document.createElement('div');
                metaRow.className = "flex items-center justify-between text-[10px] mt-2 pt-1.5 border-t gap-2";
                metaRow.style.borderColor = 'var(--line)';
                metaRow.style.color = 'var(--muted)';
                metaRow.innerHTML = `
                    <span class="truncate font-bold" title="${escapeHtml(storedPhotoFilename)}">
                        <i class="fa-regular fa-file-image ml-1"></i>${escapeHtml(storedPhotoFilename)}
                    </span>
                    <span class="flex-shrink-0">${dateFormatted}</span>
                `;

                infoDiv.appendChild(nameEl);
                infoDiv.appendChild(badgesRow);
                infoDiv.appendChild(metaRow);

                card.appendChild(imgEl);
                card.appendChild(infoDiv);
                cardsContainer.appendChild(card);

                // Render Table Row
                const tr = document.createElement('tr');
                tr.className = "cursor-pointer";
                tr.onclick = () => openStudentModal(student.id);
                tr.innerHTML = `
                    <td class="px-3 py-1.5">
                        <img src="${escapeHtml(photoUrl)}" alt="${escapeHtml(storedPhotoFilename)}" loading="lazy" onerror="this.onerror=null;this.src=window.PHOTO_PLACEHOLDER" class="w-7 h-7 rounded-lg object-cover">
                    </td>
                    <td class="px-3 font-bold truncate max-w-[180px]">${escapeHtml(student.studentName)}</td>
                    <td class="px-3 text-violet-300 whitespace-nowrap">${escapeHtml(formatBirthYearDisplay(student.birthYear))}</td>
                    <td class="px-3 text-blue-300" dir="ltr">${escapeHtml(guardianPhone)}</td>
                    <td class="px-3 truncate max-w-[160px]" style="color: var(--muted);">${escapeHtml(storedPhotoFilename)}</td>
                    <td class="px-3 text-[11px]" style="color: var(--muted);">${dateFormatted}</td>
                    <td class="px-3 text-center">
                        <span class="text-blue-400 font-bold text-[11px]">عرض</span>
                    </td>
                `;
                tableBody.appendChild(tr);
            });
        };

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // 10. Student Modal Inspection, Photo Download & Deletion (Admin Only)
        window.openStudentModal = function(studentId) {
            if (!isAdminUnlocked) return;
            const student = studentsList.find(s => s.id === studentId);
            if (!student) return;

            haptic('selection');
            const guardianPhone = student.guardianPhone || '';
            const exactPhotoFilename = student.photoFileName || buildStudentPhotoFilename(student.studentName);

            const modalPhotoEl = document.getElementById('modal-student-photo');
            modalPhotoEl.onerror = () => { modalPhotoEl.onerror = null; modalPhotoEl.src = PHOTO_PLACEHOLDER; };
            modalPhotoEl.src = student.photoUrl || PHOTO_PLACEHOLDER;
            document.getElementById('modal-student-name').textContent = student.studentName;
            document.getElementById('modal-student-birth').textContent = formatBirthYearDisplay(student.birthYear);
            document.getElementById('modal-guardian-phone').textContent = guardianPhone;
            document.getElementById('modal-photo-filename').textContent = exactPhotoFilename;
            document.getElementById('modal-call-guardian').href = `tel:${guardianPhone}`;

            const downloadLink = document.getElementById('modal-download-photo');
            downloadLink.href = student.photoUrl || '#';
            downloadLink.download = exactPhotoFilename;
            downloadLink.onclick = (event) => {
                event.preventDefault();
                downloadStudentPhoto(student.id);
            };
            document.getElementById('modal-download-photo-label').textContent = `تحميل (${exactPhotoFilename})`;

            const dateFormatted = student.createdAt
                ? new Date(student.createdAt).toLocaleDateString('ar-IQ', {
                    year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
                  })
                : '';
            document.getElementById('modal-student-date').textContent = dateFormatted;

            const delBtn = document.getElementById('modal-delete-btn');
            delBtn.onclick = () => promptDeleteStudent(student.id);

            const modal = document.getElementById('student-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            updateTelegramBackButton();
        };

        window.closeStudentModal = function() {
            haptic('light');
            const modal = document.getElementById('student-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            updateTelegramBackButton();
        };

        window.copyModalGuardianPhone = function() {            haptic('light');
            const numText = document.getElementById('modal-guardian-phone').textContent;
            const tempInput = document.createElement('textarea');
            tempInput.value = numText;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand('copy');
            document.body.removeChild(tempInput);
            showToast(`تم نسخ رقم هاتف ولي الأمر (${numText}) إلى الحافظة`, 'info');
        };

        // Photo URLs are cross-origin, so fetch the blob first to force the student-name filename
        async function downloadStudentPhoto(studentId) {
            const student = studentsList.find(s => s.id === studentId);
            if (!student || !student.photoUrl) {
                showToast('رابط الصورة غير متوفر، أعد تحديث القائمة.', 'error');
                return;
            }

            haptic('light');
            try {
                const response = await fetch(student.photoUrl);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const blob = await response.blob();
                const objectUrl = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = objectUrl;
                link.download = student.photoFileName || buildStudentPhotoFilename(student.studentName);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                setTimeout(() => URL.revokeObjectURL(objectUrl), 1500);
            } catch (err) {
                console.error("Photo download failed:", err);
                showToast('تعذر تحميل الصورة، تحقق من الاتصال وحاول مجدداً.', 'error');
            }
        }

        async function executeDeleteStudent(studentId) {
            if (!studentId) return;
            try {
                await apiFetch(`id=${encodeURIComponent(studentId)}`, { method: 'DELETE' });
                studentsList = studentsList.filter(s => s.id !== studentId);
                document.getElementById('students-count-badge').textContent = studentsList.length;
                renderStudentsList();
                closeConfirmDeleteModal();
                closeStudentModal();
                showToast('تم حذف سجل الطالب وصورته من قاعدة البيانات', 'info');
                haptic('success');
            } catch (err) {
                console.error("Error deleting student:", err);
                showToast(err.message || 'تعذر حذف السجل، حاول مرة أخرى', 'error');
                haptic('error');
            } finally {
                pendingDeleteId = null;
            }
        }

        function promptDeleteStudent(studentId) {
            haptic('warning');
            pendingDeleteId = studentId;

            if (tg?.showConfirm) {
                tg.showConfirm('هل أنت متأكد من رغبتك في حذف هذا السجل نهائياً من قاعدة البيانات؟', async (confirmed) => {
                    if (confirmed) {
                        await executeDeleteStudent(studentId);
                    } else {
                        pendingDeleteId = null;
                    }
                });
                return;
            }

            const confirmModal = document.getElementById('confirm-delete-modal');
            confirmModal.classList.remove('hidden');
            confirmModal.classList.add('flex');
            updateTelegramBackButton();
        }

        window.closeConfirmDeleteModal = function() {
            haptic('light');
            pendingDeleteId = null;
            const confirmModal = document.getElementById('confirm-delete-modal');
            confirmModal.classList.add('hidden');
            confirmModal.classList.remove('flex');
            updateTelegramBackButton();
        };

        document.getElementById('confirm-delete-yes').addEventListener('click', async () => {
            if (!pendingDeleteId) return;

            const btn = document.getElementById('confirm-delete-yes');
            btn.disabled = true;
            btn.textContent = "جاري الحذف...";

            await executeDeleteStudent(pendingDeleteId);

            btn.disabled = false;
            btn.textContent = "نعم، احذف السجل";
        });

        // 11. Download All Student Photos Named by Student Quadruple Name as a Single ZIP Archive
        window.downloadAllPhotosAsZip = async function() {
            haptic('medium');
            if (!isAdminUnlocked) return;
            if (studentsList.length === 0) {
                showToast('لا توجد صور طلاب لتحميلها حالياً', 'error');
                return;
            }
            if (typeof JSZip === 'undefined') {
                showToast('مكتبة ضغط الملفات غير جاهزة، يرجى التحقق من الاتصال', 'error');
                return;
            }

            const btn = document.getElementById('download-all-zip-btn');
            const originalHtml = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> <span>جاري تجهيز الصور بأسماء الطلاب...</span>`;

            try {
                const zip = new JSZip();
                const folder = zip.folder("صور_الطلاب_بأسمائهم");
                const usedFilenames = {};

                for (const student of studentsList) {
                    if (!student.photoUrl) continue;

                    let baseName = String(student.studentName || 'طالب')
                        .trim()
                        .replace(/\s+/g, ' ')
                        .replace(/[\\/:*?"<>|]/g, '');
                    if (!baseName) baseName = 'طالب';

                    let finalFilename = `${baseName}.jpg`;
                    if (usedFilenames[finalFilename]) {
                        usedFilenames[finalFilename] += 1;
                        finalFilename = `${baseName} (${usedFilenames[finalFilename]}).jpg`;
                    } else {
                        usedFilenames[finalFilename] = 1;
                    }

                    try {
                        const response = await fetch(student.photoUrl);
                        if (!response.ok) continue;
                        const blob = await response.blob();
                        folder.file(finalFilename, blob);
                    } catch (e) {
                        console.error("Photo fetch failed:", student.id, e);
                    }
                }

                const zipBlob = await zip.generateAsync({ type: "blob" });
                const url = URL.createObjectURL(zipBlob);
                const link = document.createElement('a');
                link.href = url;
                link.setAttribute('download', `صور_الطلاب_بأسمائهم_${new Date().toISOString().slice(0, 10)}.zip`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);

                showToast('تم تحميل أرشيف (ZIP) يحتوي على صور الطلاب مسماة بأسمائهم الرباعية!', 'success');
            } catch (err) {
                console.error("ZIP generation error:", err);
                showToast('حدث خطأ أثناء تجهيز ملف الصور المضغوط', 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalHtml;
            }
        };

        // 12. Export Database to Excel-Compatible UTF-8 CSV (Birth Year Only)
        window.exportToCSV = function() {
            haptic('medium');
            if (studentsList.length === 0) {
                showToast('لا توجد بيانات لتصديرها حالياً', 'error');
                return;
            }

            const headers = ['الاسم الرباعي للطالب', 'سنة الميلاد', 'رقم هاتف ولي الأمر', 'اسم ملف الصورة المخزون', 'تاريخ التسجيل', 'حساب تيليجرام المرسل'];
            const rows = studentsList.map(s => {
                const dateStr = s.createdAt ? new Date(s.createdAt).toLocaleString('ar-IQ') : '';
                const guardianPhone = s.guardianPhone || '';
                const photoFileName = s.photoFileName || buildStudentPhotoFilename(s.studentName);
                const birthYearStr = formatBirthYearDisplay(s.birthYear);
                return [
                    `"${(s.studentName || '').replace(/"/g, '""')}"`,
                    `"${birthYearStr.replace(/"/g, '""')}"`,
                    `"${guardianPhone.replace(/"/g, '""')}"`,
                    `"${photoFileName.replace(/"/g, '""')}"`,
                    `"${dateStr}"`,
                    `"${(s.submittedByTelegramUser || '').replace(/"/g, '""')}"`
                ].join(',');
            });

            const csvContent = "\uFEFF" + headers.join(',') + "\n" + rows.join('\n');
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);

            const link = document.createElement('a');
            link.href = url;
            link.setAttribute('download', `سجل_الطلاب_وأولياء_الأمور_${new Date().toISOString().slice(0,10)}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);

            showToast('تم تحميل ملف قاعدة البيانات (CSV / Excel) بنجاح', 'success');
        };

        // 13. Startup
        (async function initApp() {
            if (!isBackendConfigured()) {
                setDbStatus('offline');
                console.warn("[Tadhiya] apiBaseUrl is not configured. Set APP_CONFIG.apiBaseUrl to your Supabase Functions URL.");
                return;
            }

            if (!initDataRaw) {
                setDbStatus('telegram');
                console.warn("[Tadhiya] Telegram initData is unavailable. Open the page inside Telegram.");
                return;
            }

            setDbStatus('connecting');
            const isAdmin = await refreshAdminStatus();
            if (isAdmin) {
                const lockIcon = document.getElementById('admin-lock-icon');
                if (lockIcon) lockIcon.className = "fa-solid fa-unlock-keyhole text-amber-300";
            }
        })();
    </script>
